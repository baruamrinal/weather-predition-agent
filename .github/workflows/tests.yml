name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Minimum line + branch coverage; below it the tests job fails and the bot does not approve.
  COVERAGE_MIN: 80

jobs:
  pytest:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Live tests (real APIs) are excluded by pytest.ini.
      - name: Run tests (coverage must be at least ${{ env.COVERAGE_MIN }}%)
        run: |
          echo "Requirement: line + branch coverage of weather_agent must be at least ${COVERAGE_MIN}%."
          pytest -v --cov --cov-report=term-missing --cov-fail-under="$COVERAGE_MIN"
      # Runs even when the tests fail, so the run page always shows the requirement and the result.
      - id: coverage
        name: Report coverage against requirement
        if: always()
        run: |
          total=$(coverage report --format=total --precision=2 2>/dev/null) || true
          # No coverage data (e.g. tests crashed before running) prints a message, not a number
          [[ "$total" =~ ^[0-9]+(\.[0-9]+)?$ ]] || total="n/a"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          if [ "$total" != "n/a" ] && awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t >= m) }'; then
            status="✅ Met"
            echo "::notice title=Coverage requirement met::Coverage is ${total}% (minimum ${COVERAGE_MIN}%)."
          else
            status="❌ Not met"
            echo "::error title=Coverage requirement not met::Coverage is ${total}% (minimum ${COVERAGE_MIN}%)."
          fi
          {
            echo "### Test coverage"
            echo ""
            echo "| Required | Actual | Status |"
            echo "|---|---|---|"
            echo "| ${COVERAGE_MIN}% | ${total}% | ${status} |"
            echo ""
            echo "Line + branch coverage of \`weather_agent\`. Below the requirement, the job fails and the bot does not approve."
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: bot approval
    needs: pytest
    # Pull requests from this repository only: fork PRs get a read-only token
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COVERAGE: ${{ needs.pytest.outputs.coverage }}
        run: gh pr review "$PR_URL" --approve --body "All tests passed and coverage is ${COVERAGE}% (minimum ${COVERAGE_MIN}%) on ${HEAD_SHA::7}. Approved automatically by CI."
