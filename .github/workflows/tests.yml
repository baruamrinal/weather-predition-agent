name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Live tests (real APIs) are excluded by pytest.ini.
      # Fails the job, and so blocks bot approval, when line + branch coverage is under 80%.
      - run: pytest -v --cov --cov-report=term-missing --cov-fail-under=80
      - id: coverage
        run: echo "total=$(coverage report --format=total)" >> "$GITHUB_OUTPUT"

  approve:
    name: bot approval
    needs: pytest
    # Pull requests from this repository only: fork PRs get a read-only token
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COVERAGE: ${{ needs.pytest.outputs.coverage }}
        run: gh pr review "$PR_URL" --approve --body "All tests passed and coverage is ${COVERAGE}% (minimum 80%) on ${HEAD_SHA::7}. Approved automatically by CI."
